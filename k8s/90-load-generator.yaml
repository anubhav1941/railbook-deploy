# OPTIONAL: apply only to demo autoscaling (HPA). Delete after the demo.
#   kubectl apply -f k8s/90-load-generator.yaml
#   kubectl get hpa -n railbook -w
#   kubectl delete -f k8s/90-load-generator.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: railbook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -q -O /dev/null "http://inventory-service/trains/search?source=NDLS&destination=MMCT&journey_date=$$(date +%Y-%m-%d)"
                wget -q -O /dev/null "http://inventory-service/trains"
              done
          resources:
            requests: { cpu: 50m, memory: 16Mi }
            limits: { cpu: 200m, memory: 32Mi }
