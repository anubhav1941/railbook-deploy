apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
  namespace: railbook
data:
  SEED_DATA: "true"
  SEED_DAYS: "30"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: railbook
  labels:
    app: inventory-service
    app.kubernetes.io/part-of: railbook
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
        app.kubernetes.io/part-of: railbook
    spec:
      containers:
        - name: inventory-service
          # Built inside minikube with: minikube image build -t railbook/inventory-service:1.0 .
          # If using Docker Hub instead, change to <dockerhub-user>/inventory-service:latest
          image: railbook/inventory-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: inventory-config
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: DATABASE_URL } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
# NodePort also creates a ClusterIP, so booking-service reaches it at http://inventory-service
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: railbook
  labels:
    app: inventory-service
spec:
  type: NodePort
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-service
  namespace: railbook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
