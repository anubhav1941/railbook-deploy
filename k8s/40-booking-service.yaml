apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-config
  namespace: railbook
data:
  # Kubernetes DNS name of the inventory ClusterIP service (service discovery)
  INVENTORY_SERVICE_URL: "http://inventory-service"
  INVENTORY_TIMEOUT_SECONDS: "3"
  INVENTORY_RETRIES: "3"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: railbook
  labels:
    app: booking-service
    app.kubernetes.io/part-of: railbook
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
        app.kubernetes.io/part-of: railbook
    spec:
      containers:
        - name: booking-service
          # Built inside minikube with: minikube image build -t railbook/booking-service:1.0 .
          # If using Docker Hub instead, change to <dockerhub-user>/booking-service:latest
          image: railbook/booking-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: booking-config
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: booking-db-secret, key: DATABASE_URL } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: railbook
  labels:
    app: booking-service
spec:
  type: NodePort
  selector:
    app: booking-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service
  namespace: railbook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
