# Database per service: inventory-service owns this Postgres. No other service connects to it.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-secret
  namespace: railbook
type: Opaque
stringData:
  POSTGRES_DB: inventory_db
  POSTGRES_USER: inventory
  POSTGRES_PASSWORD: inventory-pass-123
  DATABASE_URL: postgresql+psycopg://inventory:inventory-pass-123@inventory-db:5432/inventory_db
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-db
  namespace: railbook
  labels:
    app: inventory-db
spec:
  clusterIP: None   # headless service for the StatefulSet
  selector:
    app: inventory-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inventory-db
  namespace: railbook
  labels:
    app: inventory-db
    app.kubernetes.io/part-of: railbook
spec:
  serviceName: inventory-db
  replicas: 1
  selector:
    matchLabels:
      app: inventory-db
  template:
    metadata:
      labels:
        app: inventory-db
        app.kubernetes.io/part-of: railbook
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
