# Local run of the whole system with Docker only (before Kubernetes).
# Each service and each database runs in its own container.
#   docker compose up --build
# Inventory Swagger: http://localhost:8001/docs
# Booking   Swagger: http://localhost:8002/docs
#
# Expects the service repos cloned next to this one:
#   ../inventory-service  ../booking-service

services:
  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_db"]
      interval: 5s
      retries: 10

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_db"]
      interval: 5s
      retries: 10

  inventory-service:
    build: ../inventory-service
    image: railbook/inventory-service:1.0
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:inventory@inventory-db:5432/inventory_db
      SEED_DATA: "true"
    ports:
      - "8001:8000"
    depends_on:
      inventory-db:
        condition: service_healthy

  booking-service:
    build: ../booking-service
    image: railbook/booking-service:1.0
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@booking-db:5432/booking_db
      INVENTORY_SERVICE_URL: http://inventory-service:8000
    ports:
      - "8002:8000"
    depends_on:
      booking-db:
        condition: service_healthy
      inventory-service:
        condition: service_started

volumes:
  inventory-data:
  booking-data:
